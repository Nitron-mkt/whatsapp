<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agenda de Campanhas — Nitron</title>
<!--
  Carregador. O painel de verdade fica no Storage do Supabase e é buscado a cada
  abertura, então publicar com host-upload já atualiza esta página — não precisa
  subir arquivo no HostGator de novo.
  Existe porque o Supabase não entrega HTML: ele reescreve o Content-Type para
  text/plain. Aqui o fetch traz o texto e a própria página o transforma em documento.
-->
<body style="margin:0;font:14px Arial,Helvetica,sans-serif;background:#f4f6f5;color:#16211e">
<div id="carregando" style="padding:22px">carregando o painel…</div>
<script>
(function(){
  var ARQ = "agenda.html";
  var URL_ARQ = "https://bwbeieumxcuomtrvlqxs.supabase.co/storage/v1/object/public/app/" + ARQ;
  fetch(URL_ARQ + "?v=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function(html){ document.open(); document.write(html); document.close(); })
    .catch(function(e){
      document.getElementById("carregando").innerHTML =
        '<b>não deu para carregar o painel</b><div style="margin-top:6px;color:#5c6b66">' +
        String(e.message) + '</div><div style="margin-top:10px"><a href="' + URL_ARQ + '">abrir o arquivo direto</a></div>';
    });
})();
</script>
